# Nginx — DESENVOLVIMENTO (HTTP na porta 80 do container; host publica 8080)

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 25M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;

        # Quem é o cliente, e por que a borda TEM de dizer isso.
        #
        # O php-fpm só vê a conexão do nginx, então sem estes três parâmetros o
        # `ip()` da aplicação é o IP DESTE container (e a allowlist do /admin, o
        # rate limiting e a trilha de auditoria comparam e gravam o endereço
        # errado). Quem obedece estes headers é a declaração TRUSTED_PROXIES —
        # ver App\Core\Http\TrustedProxies.
        #
        # `$proxy_add_x_forwarded_for` é o ponto central: ele ANEXA o endereço
        # real da conexão ao que o cliente mandou, em vez de repassar o valor do
        # cliente. Como o Laravel toma como cliente a última entrada que não é de
        # proxy confiável, o endereço anexado aqui é o que vale e o inventado
        # pelo cliente é descartado. Sem isto, declarar este nginx confiável
        # PERMITIRIA forjar IP — seria pior que não declarar nada.
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        # Sobrescreve (não repassa) o que o cliente enviar: o host visto aqui, e
        # nada mais. O header só é obedecido com TRUSTED_PROXY_TRUST_FORWARDED_HOST.
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        include fastcgi_params;
    }

    # Nunca servir arquivos ocultos (.env, .git...).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

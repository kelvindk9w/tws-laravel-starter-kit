# Nginx — PRODUÇÃO (80 → redirect HTTPS; 443 TLS + headers de segurança OWASP)

server {
    listen 80;
    server_name _;

    # ACME/Let's Encrypt (se um dia usar) e redirect geral para HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certificado autoassinado gerado no build da imagem (docker/nginx/Dockerfile).
    # Em produção real, montar certificados válidos neste caminho via volume.
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 25M;

    # Headers de segurança (referência: OWASP Secure Headers).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;
    }

    # Nunca servir arquivos ocultos (.env, .git...).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

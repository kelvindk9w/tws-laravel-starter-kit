# =============================================================================
# Docker Compose — DESENVOLVIMENTO (raiz do monorepo)
#
# Sobe, a partir da RAIZ do repositório, os serviços compartilhados
# (PostgreSQL 18, Redis 8, Mailpit) e o starter Livewire (app PHP-FPM 8.4,
# nginx na porta 8180, worker de fila e scheduler). O código do starter vive em
# starters/livewire e é montado por volume; o .env dele é o
# starters/livewire/.env. A porta 8181 fica reservada para o starter React.
#
# Os PACOTES do kit (packages/) são montados em /var/packages nos containers
# PHP (app, queue, scheduler): o composer.json do starter os instala por path
# repository, `../../packages/<pacote>`, e o vendor/ guarda um link para lá —
# que, visto de /var/www/html, é exatamente /var/packages. Edição no pacote
# vale na hora, sem reinstalar.
#
#   export UID GID=$(id -g)
#   docker compose up -d --build
#   docker compose exec app php artisan migrate
#
# Banco e Redis usam VOLUMES NOMEADOS persistentes: reiniciar ou
# derrubar os containers NUNCA apaga os dados (só `down -v`, proibido aqui).
#
# O NOME DO PROJETO É FIXO (`name:` abaixo) e igual ao de antes do monorepo:
# os volumes se chamam tws-laravel-starter-kit_postgres_data e
# tws-laravel-starter-kit_redis_data. Mudar esse nome cria volumes novos e
# vazios — o banco de desenvolvimento "some" (continua no volume antigo).
#
# Variáveis DB_* e DEV_*_PORT usadas AQUI (no Postgres e nas portas) vêm do
# ambiente do shell ou de um .env na raiz, não do starters/livewire/.env; os
# padrões são os mesmos do .env.example do starter. Quem trocar DB_* no .env do
# starter precisa exportar o mesmo valor antes do `docker compose up`.
# =============================================================================

name: tws-laravel-starter-kit

services:
  app:
    build:
      context: ./starters/livewire
      dockerfile: docker/php/Dockerfile
      target: dev
      # uid/gid do usuário do host (ver stage dev do Dockerfile). Se o seu
      # não for 1000: `export UID GID` antes do `docker compose build`.
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    env_file: ./starters/livewire/.env
    volumes:
      - ./starters/livewire:/var/www/html
      # Pacotes do kit: o starter os instala por path repository
      # (`../../packages/…` a partir de /var/www/html = /var/packages).
      - ./packages:/var/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend

  nginx:
    build:
      context: ./starters/livewire
      dockerfile: docker/nginx/Dockerfile
      target: dev
    ports:
      - "${DEV_WEB_PORT:-8180}:80"
    volumes:
      - ./starters/livewire:/var/www/html:ro
    depends_on:
      - app
    networks:
      - backend

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-tws_starter}
      POSTGRES_USER: ${DB_USERNAME:-tws}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tws_dev_password}
      # PGDATA explícito dentro do volume nomeado (persistência garantida).
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Cria o banco da suíte de testes (tws_starter_test) na primeira subida.
      - ./starters/livewire/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DEV_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tws} -d ${DB_DATABASE:-tws_starter}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:8.10-alpine
    # AOF ligado: reduz a janela de perda de jobs em reinício.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${DEV_REDIS_PORT:-16379}:6379"
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:v1.30.7
    ports:
      - "${DEV_MAILPIT_SMTP_PORT:-11025}:1025"  # SMTP
      - "${DEV_MAILPIT_WEB_PORT:-18025}:8025"  # Interface web
    networks:
      - backend

  queue:
    build:
      context: ./starters/livewire
      dockerfile: docker/php/Dockerfile
      target: dev
      # uid/gid do usuário do host (ver stage dev do Dockerfile). Se o seu
      # não for 1000: `export UID GID` antes do `docker compose build`.
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    env_file: ./starters/livewire/.env
    command: php artisan queue:work --sleep=3 --tries=3 --backoff=5
    volumes:
      - ./starters/livewire:/var/www/html
      # Pacotes do kit: o starter os instala por path repository
      # (`../../packages/…` a partir de /var/www/html = /var/packages).
      - ./packages:/var/packages
    depends_on:
      - app
      - redis
    networks:
      - backend

  scheduler:
    build:
      context: ./starters/livewire
      dockerfile: docker/php/Dockerfile
      target: dev
      # uid/gid do usuário do host (ver stage dev do Dockerfile). Se o seu
      # não for 1000: `export UID GID` antes do `docker compose build`.
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    env_file: ./starters/livewire/.env
    # Loop do scheduler nativo do Laravel (equivale ao cron de 1 em 1 minuto).
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - ./starters/livewire:/var/www/html
      # Pacotes do kit: o starter os instala por path repository
      # (`../../packages/…` a partir de /var/www/html = /var/packages).
      - ./packages:/var/packages
    depends_on:
      - app
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

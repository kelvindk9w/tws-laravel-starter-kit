# Atualizações automáticas de dependências, agrupadas por ecossistema, uma
# vez por semana, abrindo PR contra a branch de trabalho.
# Composer e npm apontam para o starter Livewire (starters/livewire); os
# pacotes twstec/kit-foundation (packages/foundation) e twstec/kit-auth
# (packages/auth) têm entrada própria.
version: 2
updates:
  - package-ecosystem: composer
    directory: /starters/livewire
    schedule:
      interval: weekly
      day: monday
    target-branch: desenvolvimento
    open-pull-requests-limit: 5
    groups:
      laravel:
        patterns: ['laravel/*', 'livewire/*', 'filament/*', 'spatie/*']
      dev:
        dependency-type: development
  # Pacote (biblioteca, sem composer.lock): `widen` ALARGA a restrição para
  # aceitar a versão nova sem largar a antiga (ex.: ^11.0 → ^11.0 || ^12.0) —
  # quem instala o pacote continua podendo ficar na versão atual, e o CI prova
  # que a nova também funciona.
  - package-ecosystem: composer
    directory: /packages/foundation
    schedule:
      interval: weekly
      day: monday
    target-branch: desenvolvimento
    open-pull-requests-limit: 5
    versioning-strategy: widen
    groups:
      laravel:
        patterns: ['laravel/*', 'spatie/*']
      dev:
        dependency-type: development
  - package-ecosystem: composer
    directory: /packages/auth
    schedule:
      interval: weekly
      day: monday
    target-branch: desenvolvimento
    open-pull-requests-limit: 5
    versioning-strategy: widen
    groups:
      laravel:
        patterns: ['laravel/*']
      dev:
        dependency-type: development
  - package-ecosystem: composer
    directory: /packages/accounts
    schedule:
      interval: weekly
      day: monday
    target-branch: desenvolvimento
    open-pull-requests-limit: 5
    versioning-strategy: widen
    groups:
      laravel:
        patterns: ['laravel/*']
      dev:
        dependency-type: development
  - package-ecosystem: npm
    directory: /starters/livewire
    schedule:
      interval: weekly
      day: monday
    target-branch: desenvolvimento
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: desenvolvimento

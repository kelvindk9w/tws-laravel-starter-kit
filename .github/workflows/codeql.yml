# Análise estática de segurança do GitHub (CodeQL) no JavaScript do kit.
# PHP não é suportado pelo CodeQL; a cobertura de PHP vem dos testes, do
# composer audit e das revisões de segurança documentadas em SECURITY.md.
name: CodeQL

on:
  push:
    branches: [desenvolvimento, sandbox, producao, '1.x']
  pull_request:
  schedule:
    - cron: '30 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analisar JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4

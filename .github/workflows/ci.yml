# CI do TWS Laravel Starter Kit — roda em todo push e PR.
# É o mesmo conjunto que o README manda rodar localmente: Pint (estilo),
# Pest (testes), auditoria de dependências PHP e Node, e o build do frontend.
# As branches sandbox e producao exigem este workflow verde para receber push.
#
# BANCO DOS TESTES — decisão:
# - O job obrigatório (`tests`) roda a suíte contra PostgreSQL 18 de verdade
#   (service container), com o phpunit.pgsql.xml. É o banco de produção: o
#   SQLite em memória escondeu bugs reais (coluna `uuid` nativa que derruba a
#   consulta com texto que não é uuid; transação abortada pelo PostgreSQL
#   depois de colisão de UNIQUE; LIKE que diferencia maiúsculas). Os testes que
#   só existem no PostgreSQL (gatilho das contas demo) rodam aqui.
# - O job `tests-sqlite` roda a MESMA suíte no SQLite em memória, que é o
#   comando padrão de quem clona o kit (`pest`, sem banco nenhum). Ele corre
#   em paralelo — não soma tempo de parede — e garante que o comando local
#   continua verde. Quem vale para produção é o job do PostgreSQL.
# - Sem Redis: a suíte força cache/sessão em array e fila sync (phpunit*.xml);
#   nenhum teste fala com Redis.
#
# MONOREPO: o aplicativo vive em starters/livewire. Os jobs de teste rodam lá
# dentro (defaults.run.working-directory) e as imagens são construídas com
# esse diretório como contexto. Os nomes dos jobs e os valores da matriz de
# imagens NÃO mudaram — são os checks obrigatórios da proteção de branch.
#
# STARTER REACT (starters/react): PASSOS dentro dos mesmos dois jobs. No do
# PostgreSQL: Pint, auditorias, build, a suíte contra o PostgreSQL (banco
# tws_starter_react_test, criado no service do job) e a simulação da
# instalação publicada (`create-project twstec/starter-react`). No do SQLite:
# tipos (tsc), lint/formatação (Vite+, como no kit oficial), build, a suíte no
# SQLite e as MESMAS combinações de módulos do Livewire (abaixo), no checkout
# do React. A imagem de produção do React é um JOB PRÓPRIO
# (`images-react`, check novo e não obrigatório — ver o comentário dele).
#
# PACOTES: o starter instala os pacotes de packages/ por path repository. A
# suíte de cada pacote (isolada, com Orchestra Testbench) roda como PASSOS
# dentro dos jobs de teste — não é check novo —, e o Pint confere o pacote no
# mesmo job que confere o starter. A imagem do app recebe a pasta packages/
# como contexto de build nomeado (`packages`).
#
# DEMONSTRAÇÃO: twstec/kit-demo é require-dev do starter. Os jobs de teste a
# instalam (é o `composer install` de quem clona o kit); o job do SQLite
# termina tirando-a (`composer remove --dev`) e rodando o build e a suíte do
# produto sem ela; a conferência da imagem do app prova que ela não chega à
# produção.
#
# MÓDULOS OPCIONAIS (accounts, uploads, admin — `php artisan tws:install`): o
# job do SQLite, depois do "sem a demo", passa pelas combinações principais
# NO PRÓPRIO CHECKOUT, uma depois da outra, com o instalador (não
# interativo): sem uploads; só o admin (sem contas nem uploads); só a base
# (foundation + auth); sem o admin (contas e uploads de volta — o caminho do
# `--with`). Em cada uma: o build do front e a suíte com o `pest` de sempre
# (os testes do módulo ausente pulam sozinhos). São PASSOS de um job que já é
# check obrigatório — nenhum check novo, e uma combinação quebrada deixa o
# check vermelho. (Um job novo com matriz seria mais rápido, mas não seria
# obrigatório sem mexer na proteção de branch.)
#
# INSTALAÇÃO PUBLICADA (simulação): no fim do job do PostgreSQL, cada pacote
# vira um ZIP (`composer archive`, com o composer.json da versão publicada) e
# o projeto é criado SÓ a partir deles (`composer create-project` com
# repositório `artifact`, pacotes copiados, sem link para o monorepo) — build e
# suíte. Pega starter que só funciona dentro do monorepo. Ver
# .github/release/simulate-install.sh; a publicação real (split) está em
# .github/workflows/split.yml, desligada.
name: CI

on:
  push:
    branches: [desenvolvimento, sandbox, producao, '1.x']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Nome = check obrigatório das branches sandbox/producao: não renomear
    # sem atualizar a proteção de branch.
    name: Pint · Pest · auditorias · build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: starters/livewire

    # PostgreSQL da mesma versão major da produção (docker-compose*.yml).
    # O banco termina em _test: a suíte recusa qualquer outro (tests/TestCase.php).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: tws_starter_test
          POSTGRES_USER: tws
          POSTGRES_PASSWORD: tws_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tws -d tws_starter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Variáveis reais do processo vencem o .env (o Laravel não sobrescreve o
    # que já está no ambiente); o nome do banco vem forçado pelo phpunit.pgsql.xml.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: tws
      DB_PASSWORD: tws_ci_password

    steps:
      - uses: actions/checkout@v7

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, pdo_sqlite, sqlite3, intl, gd, bcmath, zip, pcntl, mbstring, redis
          coverage: none

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            starters/livewire/package-lock.json
            starters/react/package-lock.json

      - name: Dependências PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Estilo (Pint)
        run: ./vendor/bin/pint --test

      # Pacote twstec/kit-foundation: é biblioteca, sem composer.lock — a suíte
      # roda contra as versões mais novas que as restrições dele aceitam.
      - name: Pacote foundation · dependências
        working-directory: packages/foundation
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Pacote foundation · estilo (Pint)
        working-directory: packages/foundation
        run: ./vendor/bin/pint --test

      - name: Pacote foundation · testes (Pest)
        working-directory: packages/foundation
        run: ./vendor/bin/pest --ci

      # Pacote twstec/kit-auth: idem; acha o foundation irmão pelo path
      # repository do próprio composer.json. A suíte sobe uma aplicação
      # Laravel limpa e prova que as proteções de autenticação vêm do pacote.
      - name: Pacote auth · dependências
        working-directory: packages/auth
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Pacote auth · estilo (Pint)
        working-directory: packages/auth
        run: ./vendor/bin/pint --test

      - name: Pacote auth · testes (Pest)
        working-directory: packages/auth
        run: ./vendor/bin/pest --ci

      # Pacote twstec/kit-accounts: idem; acha o auth e o foundation irmãos
      # pelos path repositories do próprio composer.json. A suíte sobe uma
      # aplicação Laravel limpa, com o ambiente de uma aplicação nova fixado
      # (tests/bootstrap.php), e prova que as proteções da API vêm do pacote.
      - name: Pacote accounts · dependências
        working-directory: packages/accounts
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Pacote accounts · estilo (Pint)
        working-directory: packages/accounts
        run: ./vendor/bin/pint --test

      - name: Pacote accounts · testes (Pest)
        working-directory: packages/accounts
        run: ./vendor/bin/pest --ci

      # Pacote twstec/kit-uploads: idem; acha o accounts, o auth e o
      # foundation irmãos pelos path repositories do próprio composer.json. A
      # suíte sobe uma aplicação Laravel limpa e prova que as proteções do
      # upload (validação pelo conteúdo, limite por tipo, re-encode de imagem,
      # URL assinada) vêm do pacote. Exige fileinfo e gd (já no setup-php).
      - name: Pacote uploads · dependências
        working-directory: packages/uploads
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Pacote uploads · estilo (Pint)
        working-directory: packages/uploads
        run: ./vendor/bin/pint --test

      - name: Pacote uploads · testes (Pest)
        working-directory: packages/uploads
        run: ./vendor/bin/pest --ci

      # Pacote twstec/kit-admin: idem; acha os quatro pacotes irmãos pelos
      # path repositories do próprio composer.json. A suíte sobe uma aplicação
      # Laravel limpa com o Filament e um painel que só registra o plugin, e
      # prova que as proteções do painel (allowlist de IP, só admin com conta
      # ativa, trilha de auditoria que falha fechada) vêm do pacote.
      - name: Pacote admin · dependências
        working-directory: packages/admin
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Pacote admin · estilo (Pint)
        working-directory: packages/admin
        run: ./vendor/bin/pint --test

      - name: Pacote admin · testes (Pest)
        working-directory: packages/admin
        run: ./vendor/bin/pest --ci

      # Pacote twstec/kit-demo (a demonstração do kit, require-dev do
      # starter): idem; acha os cinco pacotes irmãos pelos path repositories.
      # A suíte sobe uma aplicação Laravel limpa com o painel mínimo e prova
      # o que a demo liga sozinha — pontos de extensão, proteção das contas
      # demo, fail-closed em produção.
      - name: Pacote demo · dependências
        working-directory: packages/demo
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Pacote demo · estilo (Pint)
        working-directory: packages/demo
        run: ./vendor/bin/pint --test

      - name: Pacote demo · testes (Pest)
        working-directory: packages/demo
        run: ./vendor/bin/pest --ci

      # Pacote twstec/kit-installer (o `php artisan tws:install`, require-dev
      # do starter): idem; acha o foundation pelo path repository. O Composer
      # da suíte é de mentira — ela prova as escolhas, a ordem dos passos, a
      # recusa em produção e a idempotência sem mexer em projeto nenhum.
      - name: Pacote installer · dependências
        working-directory: packages/installer
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Pacote installer · estilo (Pint)
        working-directory: packages/installer
        run: ./vendor/bin/pint --test

      - name: Pacote installer · testes (Pest)
        working-directory: packages/installer
        run: ./vendor/bin/pest --ci

      - name: Auditoria de dependências PHP
        run: composer audit --no-interaction

      - name: Dependências Node
        run: npm ci --ignore-scripts

      - name: Auditoria de dependências Node
        run: npm audit --omit=dev --audit-level=high

      - name: Build do frontend
        run: npm run build

      - name: Ambiente de teste
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Testes (Pest · PostgreSQL 18)
        run: ./vendor/bin/pest --ci -c phpunit.pgsql.xml

      # STARTER REACT (starters/react — ver o cabeçalho): estilo, auditorias,
      # build e a suíte contra o PostgreSQL, com banco de teste próprio.
      - name: Starter React · dependências PHP
        working-directory: starters/react
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Starter React · estilo (Pint)
        working-directory: starters/react
        run: ./vendor/bin/pint --test

      - name: Starter React · auditoria de dependências (PHP e Node)
        working-directory: starters/react
        run: |
          composer audit --no-interaction
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Starter React · build do frontend
        working-directory: starters/react
        run: npm run build

      - name: Starter React · banco de teste e ambiente
        working-directory: starters/react
        run: |
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USERNAME" -d tws_starter_test -c 'CREATE DATABASE tws_starter_react_test'
          cp .env.example .env
          php artisan key:generate --force

      - name: Starter React · testes (Pest · PostgreSQL 18)
        working-directory: starters/react
        run: ./vendor/bin/pest --ci -c phpunit.pgsql.xml

      # Pacotes empacotados como o Packagist vai servir e o projeto criado só
      # a partir deles (ver o cabeçalho). Pasta fora do checkout. A demo não é
      # publicada: o projeto nasce sem ela, com a página inicial do produto,
      # e os testes dela pulam.
      - name: Instalação publicada (simulação) · pacotes, projeto, build e Pest
        working-directory: .
        run: sh .github/release/simulate-install.sh all "$RUNNER_TEMP/kit-publicado"

      # A mesma simulação com o starter React: `composer create-project
      # twstec/starter-react` só a partir dos ZIPs, o instalador no
      # post-create-project-cmd, o build do front e a suíte.
      - name: Starter React · instalação publicada (simulação) · pacotes, projeto, build e Pest
        working-directory: .
        env:
          STARTER: react
        run: sh .github/release/simulate-install.sh all "$RUNNER_TEMP/kit-publicado-react"

  # A mesma suíte no SQLite em memória — o `pest` puro de quem clona o kit.
  # Paralelo ao job acima; sem Pint/auditorias (já cobertos lá).
  tests-sqlite:
    name: Pest · SQLite (comando local padrão)
    runs-on: ubuntu-latest
    timeout-minutes: 55

    defaults:
      run:
        working-directory: starters/livewire

    steps:
      - uses: actions/checkout@v7

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, intl, gd, bcmath, zip, pcntl, mbstring, redis
          coverage: none

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            starters/livewire/package-lock.json
            starters/react/package-lock.json

      - name: Dependências PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      # As views usam @vite: sem o manifesto do build, as páginas não renderizam.
      - name: Build do frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Ambiente de teste
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Testes (Pest · SQLite)
        run: ./vendor/bin/pest --ci

      - name: Pacote foundation · dependências
        working-directory: packages/foundation
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Pacote foundation · testes (Pest)
        working-directory: packages/foundation
        run: ./vendor/bin/pest --ci

      - name: Pacote auth · dependências
        working-directory: packages/auth
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Pacote auth · testes (Pest)
        working-directory: packages/auth
        run: ./vendor/bin/pest --ci

      - name: Pacote accounts · dependências
        working-directory: packages/accounts
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Pacote accounts · testes (Pest)
        working-directory: packages/accounts
        run: ./vendor/bin/pest --ci

      - name: Pacote uploads · dependências
        working-directory: packages/uploads
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Pacote uploads · testes (Pest)
        working-directory: packages/uploads
        run: ./vendor/bin/pest --ci

      - name: Pacote admin · dependências
        working-directory: packages/admin
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Pacote admin · testes (Pest)
        working-directory: packages/admin
        run: ./vendor/bin/pest --ci

      - name: Pacote demo · dependências
        working-directory: packages/demo
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Pacote demo · testes (Pest)
        working-directory: packages/demo
        run: ./vendor/bin/pest --ci

      - name: Pacote installer · dependências
        working-directory: packages/installer
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Pacote installer · testes (Pest)
        working-directory: packages/installer
        run: ./vendor/bin/pest --ci

      # STARTER REACT (starters/react): dependências, checagem de tipos
      # (tsc), lint e formatação (Vite+ do kit oficial), build e a suíte no
      # SQLite em memória — o comando local padrão. Antes dos passos que mexem
      # no checkout do Livewire.
      - name: Starter React · dependências PHP
        working-directory: starters/react
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Starter React · tipos (tsc), lint/formatação e build
        working-directory: starters/react
        run: |
          npm ci --ignore-scripts
          npm run types:check
          npm run check
          npm run build

      - name: Starter React · testes (Pest · SQLite)
        working-directory: starters/react
        run: |
          cp .env.example .env
          php artisan key:generate --force
          ./vendor/bin/pest --ci

      # AS COMBINAÇÕES DE MÓDULOS DO REACT (ver o cabeçalho), no checkout do
      # React, em sequência, pelo instalador — as mesmas do Livewire. O banco
      # das migrations do instalador é um SQLite descartável, só nos passos
      # do instalador (env do passo; nada vai para o GITHUB_ENV, que valeria
      # também para os passos do Livewire abaixo).
      - name: Starter React · combinações · banco descartável do instalador
        working-directory: starters/react
        run: touch database/combinacoes.sqlite

      - name: Starter React · Sem uploads · instalador
        working-directory: starters/react
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/starters/react/database/combinacoes.sqlite
          CACHE_STORE: file
          SESSION_DRIVER: file
          QUEUE_CONNECTION: sync
        run: php artisan tws:install --no-interaction --without=uploads

      - name: Starter React · Sem uploads · build e testes
        working-directory: starters/react
        run: |
          npm run build
          ./vendor/bin/pest --ci

      - name: Starter React · Só o admin (sem contas nem uploads) · instalador
        working-directory: starters/react
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/starters/react/database/combinacoes.sqlite
          CACHE_STORE: file
          SESSION_DRIVER: file
          QUEUE_CONNECTION: sync
        run: php artisan tws:install --no-interaction --without=accounts,uploads

      - name: Starter React · Só o admin (sem contas nem uploads) · build e testes
        working-directory: starters/react
        run: |
          npm run build
          ./vendor/bin/pest --ci

      - name: Starter React · Só a base (foundation + auth) · instalador
        working-directory: starters/react
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/starters/react/database/combinacoes.sqlite
          CACHE_STORE: file
          SESSION_DRIVER: file
          QUEUE_CONNECTION: sync
        run: php artisan tws:install --no-interaction --without=admin,accounts,uploads

      - name: Starter React · Só a base (foundation + auth) · build e testes
        working-directory: starters/react
        run: |
          npm run build
          # Sem o admin não há Filament: o tema do /admin sai do build.
          if grep -q 'filament.css' public/build/manifest.json; then echo 'build sem o admin com o tema do /admin'; exit 1; fi
          ./vendor/bin/pest --ci

      - name: Starter React · Sem o admin (contas e uploads de volta) · instalador
        working-directory: starters/react
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/starters/react/database/combinacoes.sqlite
          CACHE_STORE: file
          SESSION_DRIVER: file
          QUEUE_CONNECTION: sync
        run: php artisan tws:install --no-interaction --with=accounts,uploads --without=admin

      - name: Starter React · Sem o admin (contas e uploads de volta) · build e testes
        working-directory: starters/react
        run: |
          npm run build
          # Sem o admin não há Filament: o tema do /admin sai do build.
          if grep -q 'filament.css' public/build/manifest.json; then echo 'build sem o admin com o tema do /admin'; exit 1; fi
          ./vendor/bin/pest --ci

      # O PRODUTO SEM A DEMONSTRAÇÃO: o que acontece com quem tira a demo
      # (`composer remove --dev twstec/kit-demo`, docs/demo.md). O build do
      # frontend continua de pé sem as entradas da demo, e a suíte do starter
      # passa com o `pest` de sempre — os testes do grupo `demo` pulam
      # sozinhos. Últimos passos do job: mexem no checkout.
      - name: Sem a demo · remover o pacote
        run: composer remove --dev twstec/kit-demo --no-interaction --no-progress

      - name: Sem a demo · build do frontend
        run: |
          npm run build
          if grep -q 'kit-demo' public/build/manifest.json; then echo 'build sem a demo com entrada da demo'; exit 1; fi

      - name: Sem a demo · testes (Pest · SQLite)
        run: ./vendor/bin/pest --ci

      # AS COMBINAÇÕES DE MÓDULOS (ver o cabeçalho), no checkout, em
      # sequência, pelo instalador. O banco das migrations do instalador é um
      # SQLite descartável (o .env de teste aponta para o PostgreSQL do
      # docker, que não existe aqui); cache em arquivo pelo mesmo motivo.
      - name: Combinações · banco descartável do instalador
        run: |
          touch database/combinacoes.sqlite
          {
            echo "DB_CONNECTION=sqlite"
            echo "DB_DATABASE=$PWD/database/combinacoes.sqlite"
            echo "CACHE_STORE=file"
            echo "SESSION_DRIVER=file"
            echo "QUEUE_CONNECTION=sync"
          } >> "$GITHUB_ENV"

      - name: Sem uploads · instalador
        run: php artisan tws:install --no-interaction --without=uploads --no-demo

      - name: Sem uploads · build e testes
        run: |
          npm run build
          ./vendor/bin/pest --ci --parallel

      - name: Só o admin (sem contas nem uploads) · instalador
        run: php artisan tws:install --no-interaction --without=accounts,uploads

      - name: Só o admin (sem contas nem uploads) · build e testes
        run: |
          npm run build
          ./vendor/bin/pest --ci --parallel

      - name: Só a base (foundation + auth) · instalador
        run: php artisan tws:install --no-interaction --without=admin,accounts,uploads

      - name: Só a base (foundation + auth) · build e testes
        run: |
          npm run build
          # Sem o admin não há Filament: o tema do /admin sai do build.
          if grep -q 'filament.css' public/build/manifest.json; then echo 'build sem o admin com o tema do /admin'; exit 1; fi
          ./vendor/bin/pest --ci --parallel

      - name: Sem o admin (contas e uploads de volta) · instalador
        run: php artisan tws:install --no-interaction --with=accounts,uploads --without=admin

      - name: Sem o admin (contas e uploads de volta) · build e testes
        run: |
          npm run build
          ./vendor/bin/pest --ci --parallel

  # Imagens de PRODUÇÃO (app PHP-FPM e nginx), construídas de ponta a ponta a
  # cada push e PR — sem enviar para registry nenhum.
  #
  # POR QUE ESTE JOB EXISTE: a imagem de produção ficou sem construir desde que
  # o Horizon entrou (o estágio do composer não tinha ext-pcntl), e nada
  # percebeu, porque o CI testava o código mas nunca construía a imagem que vai
  # para o servidor. Um kit cuja imagem de produção não constrói não pode ser
  # divulgado. Build que falha aqui = CI vermelho.
  images:
    name: Imagens de produção (app · nginx)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            dockerfile: docker/php/Dockerfile
          - image: nginx
            dockerfile: docker/nginx/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.image }} (target prod)
        uses: docker/build-push-action@v6
        with:
          # Contexto = o starter; o Dockerfile da matriz é relativo a ele.
          # A pasta packages/ entra como contexto nomeado: o estágio do
          # composer da imagem do app instala os pacotes do kit a partir dela.
          context: starters/livewire
          file: starters/livewire/${{ matrix.dockerfile }}
          build-contexts: |
            packages=packages
          target: prod
          push: false
          load: ${{ matrix.image == 'app' }}
          tags: tws-starter-${{ matrix.image }}:ci
          cache-from: type=gha,scope=prod-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=prod-${{ matrix.image }}

      # Prova mínima de que a imagem do app é utilizável, e de que nada que não
      # deveria viajar foi junto: arquivo de ambiente, testes, storage local.
      - name: Conferência da imagem do app
        if: matrix.image == 'app'
        run: |
          docker run --rm --entrypoint php tws-starter-app:ci -m | grep -qx pcntl
          # Extensões de imagem e de MIME real do twstec/kit-uploads.
          docker run --rm --entrypoint php tws-starter-app:ci -m | grep -qx gd
          docker run --rm --entrypoint php tws-starter-app:ci -m | grep -qx fileinfo
          docker run --rm --entrypoint sh tws-starter-app:ci -c '
            set -e
            test "$(id -u)" != 0
            for proibido in .env .env.example .env.prod.example tests phpunit.xml phpunit.pgsql.xml node_modules; do
              if [ -e "/var/www/html/$proibido" ]; then echo "na imagem: $proibido"; exit 1; fi
            done
            test -z "$(find /var/www/html/storage -type f)"
            # Pacotes do kit COPIADOS para o vendor (nunca link para fora da
            # imagem) e sem o que é de desenvolvimento deles.
            for pacote in kit-foundation kit-auth kit-accounts kit-uploads kit-admin; do
              test -d "vendor/twstec/$pacote/src"
              test ! -L "vendor/twstec/$pacote"
              for proibido in tests vendor composer.lock phpunit.xml; do
                if [ -e "vendor/twstec/$pacote/$proibido" ]; then echo "no pacote $pacote: $proibido"; exit 1; fi
              done
            done
            # O tema do painel é compilado pelo app com as fontes do
            # twstec/kit-admin (resources/css/sources.css): o pacote precisa
            # levar os resources dele para a imagem.
            test -f vendor/twstec/kit-admin/resources/css/sources.css
            # A DEMONSTRAÇÃO (twstec/kit-demo, require-dev) NÃO vai para
            # produção: nem o pacote, nem o registro dele no Composer, nem as
            # entradas das landings e as imagens no build do frontend, nem as
            # rotas dela.
            if [ -e vendor/twstec/kit-demo ]; then echo "na imagem: vendor/twstec/kit-demo"; exit 1; fi
            # O instalador (twstec/kit-installer, require-dev) também não.
            if [ -e vendor/twstec/kit-installer ]; then echo "na imagem: vendor/twstec/kit-installer"; exit 1; fi
            if grep -q "twstec/kit-demo" vendor/composer/installed.json; then echo "na imagem: twstec/kit-demo instalado"; exit 1; fi
            if grep -q "kit-demo" public/build/manifest.json; then echo "na imagem: assets da demo no build"; exit 1; fi
            if [ -e public/build/assets/img ]; then echo "na imagem: imagens da demo no build"; exit 1; fi
            if [ -n "$(find /var/www/html -path /var/www/html/vendor -prune -o -name "*.php" -print | xargs grep -l "Twstec.Kit.Demo" 2>/dev/null)" ]; then echo "na imagem: código que nomeia a demo"; exit 1; fi
            php artisan --version
            if php artisan route:list --json | grep -q "landing"; then echo "na imagem: rotas da demo"; exit 1; fi
          '

  # Imagens de PRODUÇÃO do STARTER REACT (starters/react/docker): o mesmo
  # desenho e as mesmas conferências da imagem do Livewire, mais as do front
  # React. JOB PRÓPRIO, e não entradas novas na matriz do job acima: aquele
  # job gera dois checks obrigatórios da proteção de branch, e o nome de cada
  # um vem dos valores da matriz — acrescentar uma chave (o starter) mudaria
  # os nomes. Este job é check novo, não obrigatório.
  images-react:
    name: Imagens de produção do starter React (app · nginx)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            dockerfile: docker/php/Dockerfile
          - image: nginx
            dockerfile: docker/nginx/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.image }} (target prod)
        uses: docker/build-push-action@v6
        with:
          # Contexto = o starter React; a pasta packages/ entra como contexto
          # nomeado, como na imagem do Livewire.
          context: starters/react
          file: starters/react/${{ matrix.dockerfile }}
          build-contexts: |
            packages=packages
          target: prod
          push: false
          load: ${{ matrix.image == 'app' }}
          tags: tws-starter-react-${{ matrix.image }}:ci
          cache-from: type=gha,scope=prod-react-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=prod-react-${{ matrix.image }}

      # Extensões, usuário, nada de ambiente/testes/E2E/storage/SQLite, pacotes
      # copiados, sem a demo e sem o instalador, o front React no manifesto e
      # o artisan de pé. Ver o script.
      - name: Conferência da imagem do app
        if: matrix.image == 'app'
        run: sh .github/images/check-react-app.sh tws-starter-react-app:ci

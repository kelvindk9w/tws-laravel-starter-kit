# PUBLICAÇÃO — split do monorepo para os repositórios só-leitura (DESLIGADO).
#
# A cada tag `v2.*`, copiaria cada pacote (packages/*), os starters
# (starters/livewire e starters/react) e o comando único (starters/kit →
# twstec/kit) para o repositório só-leitura de cada um, com a mesma tag — 10
# destinos. A DEMONSTRAÇÃO (packages/demo) NÃO é publicada: vive só no
# monorepo, e o starter publicado sai sem ela (ver prepare-composer.php); o
# Packagist lê esses repositórios (webhook) e publica a versão. Quem usa o kit
# instala só o que escolheu (`composer create-project twstec/kit`, o comando
# único com o menu; ou `composer create-project twstec/starter-livewire` /
# `twstec/starter-react` / `laravel new --using=`; ou `composer require
# twstec/kit-auth` num aplicativo que já existe).
#
# ESTÁ DESLIGADO até a fase F10b, que depende do dono: os repositórios vazios
# criados na conta kelvindk9w (nomes na matriz), o segredo SPLIT_TOKEN (token
# com escrita SÓ nesses repositórios) e o registro de cada um no Packagist,
# com o webhook. O job só roda com a VARIÁVEL do repositório
# KIT_SPLIT_ENABLED = true (Settings → Secrets and variables → Actions →
# Variables), que não existe: a tag dispara o workflow e o job sai como
# "skipped". Ligar = criar a variável; desligar de novo = apagá-la. (Um
# `if: false` literal faria o mesmo, mas o actionlint o recusa como condição
# constante.)
#
# Antes da cópia, o composer.json de cada pasta vira o da versão publicada
# (.github/release/prepare-composer.php): sem os path repositories do
# monorepo, com os pacotes do kit em `^2.0` (no starter, `^2.0@beta` enquanto
# a versão for pré-release) e, no starter, sem o composer.lock e com o
# docker-compose.prod.yml sem o contexto de build `packages` do monorepo; no
# twstec/kit, com a restrição do starter que ele baixa
# (`extra.twstec-kit.constraint`) e sem a suíte dele. É exatamente o
# que a simulação da instalação publicada, no CI, instala e testa
# (.github/release/simulate-install.sh — inclusive `STARTER=kit`).
name: Publicação (split) — desligada

on:
  push:
    tags: ['v2.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (ex.: v2.0.0-beta.1) — precisa existir no monorepo'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: split-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # A conta dos repositórios espelho (split) e do endereço que o Packagist lê.
  SPLIT_OWNER: kelvindk9w

jobs:
  # A LISTA DOS ESPELHOS, num lugar só: o split copia cada pasta para o
  # repositório dela, o aviso ao Packagist percorre a mesma lista e a
  # conferência final exige cada `package` publicado no Packagist com a tag —
  # um espelho novo entra aqui e vale nos três.
  mirrors:
    name: Espelhos
    if: vars.KIT_SPLIT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.list.outputs.include }}
    steps:
      # Ordem = ordem da publicação (max-parallel 1): os pacotes, o
      # instalador (require-dev dos starters: sem ele publicado, o
      # create-project do starter não resolve), os starters (o React: o
      # espelho foi criado pelo dono) e por último o comando único
      # (`composer create-project twstec/kit`), que baixa o starter escolhido
      # no menu. Todo espelho precisa estar no token SPLIT_TOKEN.
      - name: Lista
        id: list
        run: |
          cat <<'JSON' > "$RUNNER_TEMP/mirrors.json"
          [
            {"path": "packages/foundation", "repository": "twstec-kit-foundation", "package": "twstec/kit-foundation"},
            {"path": "packages/auth", "repository": "twstec-kit-auth", "package": "twstec/kit-auth"},
            {"path": "packages/accounts", "repository": "twstec-kit-accounts", "package": "twstec/kit-accounts"},
            {"path": "packages/uploads", "repository": "twstec-kit-uploads", "package": "twstec/kit-uploads"},
            {"path": "packages/admin", "repository": "twstec-kit-admin", "package": "twstec/kit-admin"},
            {"path": "packages/webhooks", "repository": "twstec-kit-webhooks", "package": "twstec/kit-webhooks"},
            {"path": "packages/installer", "repository": "twstec-kit-installer", "package": "twstec/kit-installer"},
            {"path": "starters/livewire", "repository": "twstec-starter-livewire", "package": "twstec/starter-livewire"},
            {"path": "starters/react", "repository": "twstec-starter-react", "package": "twstec/starter-react"},
            {"path": "starters/kit", "repository": "twstec-kit", "package": "twstec/kit"}
          ]
          JSON
          echo "include=$(jq -c . "$RUNNER_TEMP/mirrors.json")" >> "$GITHUB_OUTPUT"

  split:
    name: Split · ${{ matrix.path }}
    # DESLIGADO até a F10b (ver o cabeçalho): sem a variável, não roda.
    needs: mirrors
    if: vars.KIT_SPLIT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.mirrors.outputs.include) }}

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      # Só tag de versão 2.x (a entrada manual também passa por aqui).
      - name: Tag válida
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v2\.[0-9]+\.[0-9]+(-(alpha|beta|RC|rc)\.[0-9]+)?$'; then
            echo "tag inválida: $TAG"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none

      - name: composer.json (e, no starter, compose de produção) da versão publicada
        run: php .github/release/prepare-composer.php "${{ matrix.path }}" "$TAG"

      - name: Cópia para ${{ env.SPLIT_OWNER }}/${{ matrix.repository }}
        uses: symplify/monorepo-split-github-action@ac9845270ef47266435b4f124b133a323619e738 # v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          package_directory: ${{ matrix.path }}
          repository_organization: ${{ env.SPLIT_OWNER }}
          repository_name: ${{ matrix.repository }}
          branch: main
          tag: ${{ env.TAG }}
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

      # A ação acima engole erro de push: na 2.0.0-beta.15 o SPLIT_TOKEN não
      # tinha o espelho twstec-kit-webhooks, o push levou 403 e o job saiu
      # verde com o espelho vazio. Aqui a prova é o espelho: a tag e a branch
      # main precisam estar lá, senão o job reprova.
      - name: Conferir o espelho
        env:
          REPOSITORY: ${{ matrix.repository }}
        run: |
          url="https://github.com/$SPLIT_OWNER/$REPOSITORY"
          if ! git ls-remote --exit-code --tags "$url" "refs/tags/$TAG" >/dev/null; then
            echo "::error title=Espelho sem a versão::$url não recebeu a tag $TAG — confira se o SPLIT_TOKEN não venceu e se tem o espelho (Contents: read and write); depois rode de novo"
            exit 1
          fi
          if ! git ls-remote --exit-code --heads "$url" main >/dev/null; then
            echo "::error title=Espelho sem a branch main::$url não tem a branch main (o Packagist lê o composer.json dela) — rode de novo"
            exit 1
          fi
          echo "ok: $url tem $TAG e main"

  # O PACKAGIST fica sabendo da versão nova. Os espelhos não têm webhook (o
  # split empurra com o SPLIT_TOKEN, e o Packagist não os acompanha sozinho:
  # "not auto-updated"); então, depois que TODOS os splits passam, este job
  # chama a API documentada do Packagist para cada espelho da lista:
  #   POST https://packagist.org/api/update-package
  #   Authorization: Bearer <usuário>:<token>   (fora da URL e do log)
  #   {"repository": "https://github.com/<conta>/<espelho>"}
  # O endpoint aceita o token SAFE do perfil no Packagist (o recomendado para
  # CI). O dono cria o segredo PACKAGIST_API_TOKEN e a variável
  # PACKAGIST_USERNAME; sem eles, o job avisa no log e sai sem falhar (o
  # split já está feito — dá para atualizar à mão no Packagist). Com eles,
  # cada chamada tenta de novo em erro de rede ou 5xx, e qualquer resposta de
  # erro deixa o job VERMELHO, com o espelho e o status (nunca o token).
  packagist:
    name: Avisar o Packagist
    needs: [mirrors, split]
    if: vars.KIT_SPLIT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGIST_USERNAME: ${{ vars.PACKAGIST_USERNAME }}
      PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
      MIRRORS: ${{ needs.mirrors.outputs.include }}
    steps:
      - name: update-package de cada espelho
        run: |
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_API_TOKEN" ]; then
            echo "::warning title=Packagist não avisado::Faltam a variável PACKAGIST_USERNAME e/ou o segredo PACKAGIST_API_TOKEN. O split foi feito; atualize os pacotes à mão no Packagist ou configure os dois (docs/instalacao.md, seção Publicação)."
            exit 0
          fi

          repositories=$(printf '%s' "$MIRRORS" | jq -r '.[].repository')
          if [ -z "$repositories" ]; then
            echo "::error title=Packagist não avisado::a lista dos espelhos veio vazia"
            exit 1
          fi

          # O cabeçalho vai por arquivo (nada de token na linha de comando
          # nem na URL), só legível pelo job e apagado na saída; sem `set -x`.
          header="$RUNNER_TEMP/packagist-auth"
          trap 'rm -f "$header" "$RUNNER_TEMP/packagist-response"' EXIT
          umask 077
          printf 'Authorization: Bearer %s:%s\n' "$PACKAGIST_USERNAME" "$PACKAGIST_API_TOKEN" > "$header"

          failed=0
          for repository in $repositories; do
            url="https://github.com/$SPLIT_OWNER/$repository"
            body=$(jq -cn --arg url "$url" '{repository: $url}')
            status=$(curl -sS -o "$RUNNER_TEMP/packagist-response" -w '%{http_code}' \
              --retry 3 --retry-delay 5 --retry-all-errors --max-time 30 \
              -X POST -H @"$header" -H 'Content-Type: application/json' \
              --data "$body" https://packagist.org/api/update-package) || status=000
            if [ "${status#2}" != "$status" ] && jq -e '.status == "success"' "$RUNNER_TEMP/packagist-response" >/dev/null 2>&1; then
              echo "ok: $url"
            else
              echo "::error title=Packagist recusou::$url → HTTP $status: $(head -c 300 "$RUNNER_TEMP/packagist-response" 2>/dev/null)"
              failed=1
            fi
          done

          exit "$failed"

  # A CONFERÊNCIA FINAL: cada pacote da lista responde no Packagist com a
  # versão da tag. Pega o espelho que nunca foi REGISTRADO no Packagist (o
  # `twstec/kit-webhooks` da 2.0.0-beta.15 ficou assim, e o `composer
  # require` não achava o pacote). Roda mesmo sem o token do aviso
  # (aí a atualização é à mão, e esta conferência diz se ela foi feita) e
  # mesmo com o aviso vermelho. Lê o metadado público
  # (https://repo.packagist.org/p2/<pacote>.json), sem credencial; o Packagist
  # leva alguns minutos para refletir a versão, por isso tenta por até 10.
  packagist-check:
    name: Conferir o Packagist
    needs: [mirrors, packagist]
    if: always() && vars.KIT_SPLIT_ENABLED == 'true' && needs.mirrors.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIRRORS: ${{ needs.mirrors.outputs.include }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Cada pacote publicado com a tag
        run: |
          packages=$(printf '%s' "$MIRRORS" | jq -r '.[].package')
          if [ -z "$packages" ]; then
            echo "::error title=Packagist não conferido::a lista dos espelhos veio vazia"
            exit 1
          fi

          failed=0
          for package in $packages; do
            found=0
            status=000
            for _ in $(seq 1 20); do
              status=$(curl -sS -o "$RUNNER_TEMP/p2.json" -w '%{http_code}' --max-time 30 \
                "https://repo.packagist.org/p2/$package.json") || status=000
              if [ "$status" = 200 ] && jq -e --arg tag "$TAG" --arg package "$package" \
                '.packages[$package] | map(.version) | index($tag) != null' "$RUNNER_TEMP/p2.json" >/dev/null 2>&1; then
                found=1
                break
              fi
              sleep 30
            done

            if [ "$found" = 1 ]; then
              echo "ok: $package $TAG"
            elif [ "$status" = 404 ]; then
              echo "::error title=Pacote fora do Packagist::$package não está registrado no Packagist — registre https://github.com/$SPLIT_OWNER/<espelho> (docs/instalacao.md, seção Publicação) e rode de novo os jobs que falharam"
              failed=1
            else
              echo "::error title=Versão fora do Packagist::$package não mostra $TAG no Packagist (HTTP $status) — confira o aviso ao Packagist ou clique em Update no pacote"
              failed=1
            fi
          done

          exit "$failed"

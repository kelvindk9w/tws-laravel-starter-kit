# Criação de projeto no Windows e no macOS — só à mão (Actions → "Instalação
# no Windows e no macOS" → Run workflow).
#
# O CI do kit (ci.yml) roda no Linux. Este workflow prova, nas máquinas do
# GitHub (windows-latest e macos-latest), que um projeto nasce pelos caminhos
# documentados em docs/instalacao.md. A entrada `fonte` escolhe de onde vêm o
# twstec/kit, os starters e os pacotes:
#
# - `packagist` (padrão): o pacote PUBLICADO, como quem usa o kit;
# - `branch`: o código da branch escolhida no "Run workflow", antes de
#   publicar. Um job no Linux monta os ZIPs como a simulação da instalação
#   publicada do CI (.github/release/simulate-install.sh, etapas copy e
#   archive), numa versão que só existe neles (VERSAO_BRANCH); cada máquina
#   os recebe como repositório `artifact` na configuração GLOBAL do Composer
#   — que vale para o `composer create-project`, para o `laravel new` e para
#   o Composer que o instalador chama — e o projeto é conferido com essa
#   versão instalada. O resto do caminho (comandos, terminais) é o mesmo.
#
# - `composer create-project "twstec/kit:~2.0"` (o comando único) e
#   `laravel new --using="twstec/kit:~2.0" --database=sqlite --phpunit
#   --no-boost` (o instalador do Laravel, posto pelo `composer global
#   require`);
# - as duas interfaces (react e livewire), escolhidas pelas variáveis
#   TWS_KIT_* — SQLite e sem Redis, porque essas máquinas não têm o Docker de
#   desenvolvimento (Linux) do projeto;
# - no Windows, pelos dois terminais de quem não tem WSL: PowerShell e `cmd`
#   (o `^` da restrição de versão é o ponto sensível do `cmd`); no macOS, pelo
#   bash. Cada terminal usa a sintaxe da documentação para as variáveis. A
#   restrição é `~2.0`, como na documentação: com `^`, o PowerShell
#   tira as aspas ao chamar o composer.bat e o `cmd` come o `^`.
#
# O PHP é o 8.4 com as extensões que os pacotes exigem — no Windows, sem
# `pcntl`/`posix`, que o PHP do Windows não tem (o instalador as ignora
# sozinho; só o Horizon as exige, e ele não entra sem Redis), e com a `sodium`
# (uploads confidenciais), que o PHP do Windows traz desligada.
#
# Depois de criado, o projeto é conferido: os arquivos esperados (e os do
# twstec/kit fora), o `.env` com SQLite e os drivers de sessão, cache e fila
# no banco, `php artisan about`, `php artisan migrate`, o build do front e a
# suíte inteira do projeto (`php artisan test`, SQLite em memória) — qualquer
# falha reprova (os testes que dependiam de caminho com `/`, do bit de
# execução ou do import() do Node com caminho do Linux ficaram portáveis,
# issue #101; só a conferência do bit de execução pula no Windows, que não o
# tem).
#
# Os runners do macOS custam mais (em repositório privado, 10× os minutos do
# Linux): a entrada `sistemas` deixa rodar um sistema só.
name: Instalação no Windows e no macOS

on:
  workflow_dispatch:
    inputs:
      sistemas:
        description: Sistemas
        type: choice
        options: [todos, windows, macos]
        default: todos
      fonte:
        description: De onde vem o kit (packagist = o publicado; branch = o código da branch escolhida acima)
        type: choice
        options: [packagist, branch]
        default: packagist

permissions:
  contents: read

env:
  # A versão dos ZIPs com `fonte=branch`: estável, acima de qualquer versão
  # 2.x publicada e dentro de ~2.0 — instalada, prova que o projeto veio da
  # branch.
  VERSAO_BRANCH: 2.999.999

jobs:
  # Só com `fonte=branch`: os ZIPs do código da branch (pacotes, starters e o
  # twstec/kit), como o Packagist vai servir.
  zips:
    name: ZIPs da branch
    if: inputs.fonte == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Montar os ZIPs
        env:
          STARTER: kit
        run: |
          VERSION="$VERSAO_BRANCH" sh .github/release/simulate-install.sh copy "$RUNNER_TEMP/kit-branch"
          VERSION="$VERSAO_BRANCH" sh .github/release/simulate-install.sh archive "$RUNNER_TEMP/kit-branch"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kit-zips
          path: ${{ runner.temp }}/kit-branch/packages/*.zip
          if-no-files-found: error
          retention-days: 1

  criar:
    name: ${{ matrix.sistema }} · ${{ matrix.shell }} · ${{ matrix.caminho }} · ${{ matrix.stack }}
    needs: zips
    # Com `fonte=packagist`, o job dos ZIPs é pulado e este roda assim mesmo.
    if: ${{ !cancelled() && needs.zips.result != 'failure' }}
    runs-on: ${{ matrix.sistema }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sistema: ${{ fromJSON(inputs.sistemas == 'windows' && '["windows-latest"]' || inputs.sistemas == 'macos' && '["macos-latest"]' || '["windows-latest","macos-latest"]') }}
        shell: [pwsh, cmd, bash]
        caminho: [create-project, laravel-new]
        stack: [react, livewire]
        exclude:
          - { sistema: windows-latest, shell: bash }
          - { sistema: macos-latest, shell: pwsh }
          - { sistema: macos-latest, shell: cmd }
    env:
      PROJETO: ${{ github.workspace }}/meu-app
    steps:
      - name: PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: ${{ runner.os == 'Windows' && 'bcmath, curl, fileinfo, gd, intl, mbstring, openssl, pdo_sqlite, sodium, sqlite3, zip' || 'bcmath, curl, fileinfo, gd, intl, mbstring, openssl, pcntl, pdo_sqlite, posix, sqlite3, zip' }}
          coverage: none
          tools: composer

      - name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'

      - name: Instalador do Laravel (composer global require)
        if: matrix.caminho == 'laravel-new'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          composer global require laravel/installer --no-interaction
          composer global config bin-dir --absolute 2>$null | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: ZIPs da branch
        if: inputs.fonte == 'branch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit-zips
          path: ${{ runner.temp }}/kit-zips

      # Na configuração global, o repositório vale para todo Composer desta
      # máquina (create-project, laravel new, o do instalador) e vem antes do
      # Packagist: os pacotes twstec/* saem só dele.
      - name: Composer com os ZIPs da branch
        if: inputs.fonte == 'branch'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $zips = (Join-Path $env:RUNNER_TEMP 'kit-zips') -replace '\\', '/'
          Get-ChildItem -LiteralPath $zips | ForEach-Object { $_.Name }
          composer config --global repositories.kit-branch artifact $zips
          Get-Content -Raw -LiteralPath (Join-Path (composer config --global home) 'config.json')

      - name: Versões
        shell: pwsh
        run: |
          php -v
          php -m
          composer --version
          node --version
          if ('${{ matrix.caminho }}' -eq 'laravel-new') { laravel --version }

      # ---- Criar o projeto: a sintaxe de cada terminal, como na documentação.

      - name: Criar (PowerShell · composer create-project)
        if: matrix.shell == 'pwsh' && matrix.caminho == 'create-project'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $env:TWS_KIT_STACK = "${{ matrix.stack }}"; $env:TWS_KIT_DATABASE = "sqlite"; $env:TWS_KIT_REDIS = "0"
          composer create-project "twstec/kit:~2.0" meu-app

      - name: Criar (PowerShell · laravel new)
        if: matrix.shell == 'pwsh' && matrix.caminho == 'laravel-new'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $env:TWS_KIT_STACK = "${{ matrix.stack }}"; $env:TWS_KIT_DATABASE = "sqlite"; $env:TWS_KIT_REDIS = "0"
          laravel new meu-app --using="twstec/kit:~2.0" --database=sqlite --phpunit --no-boost

      # No `cmd`, o comando de criação é a ÚLTIMA linha e sem `call`, como
      # quem digita no terminal: `call` dobraria o `^` entre aspas, e um .bat
      # (composer.bat, laravel.bat) chamado sem `call` não volta ao roteiro.
      - name: Criar (cmd · composer create-project)
        if: matrix.shell == 'cmd' && matrix.caminho == 'create-project'
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          set TWS_KIT_STACK=${{ matrix.stack }}
          set TWS_KIT_DATABASE=sqlite
          set TWS_KIT_REDIS=0
          composer create-project "twstec/kit:~2.0" meu-app

      - name: Criar (cmd · laravel new)
        if: matrix.shell == 'cmd' && matrix.caminho == 'laravel-new'
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          set TWS_KIT_STACK=${{ matrix.stack }}
          set TWS_KIT_DATABASE=sqlite
          set TWS_KIT_REDIS=0
          laravel new meu-app --using="twstec/kit:~2.0" --database=sqlite --phpunit --no-boost

      - name: Criar (bash · composer create-project)
        if: matrix.shell == 'bash' && matrix.caminho == 'create-project'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: TWS_KIT_STACK=${{ matrix.stack }} TWS_KIT_DATABASE=sqlite TWS_KIT_REDIS=0 composer create-project "twstec/kit:~2.0" meu-app

      - name: Criar (bash · laravel new)
        if: matrix.shell == 'bash' && matrix.caminho == 'laravel-new'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: TWS_KIT_STACK=${{ matrix.stack }} TWS_KIT_DATABASE=sqlite TWS_KIT_REDIS=0 laravel new meu-app --using="twstec/kit:~2.0" --database=sqlite --phpunit --no-boost

      # ---- Conferir o projeto criado (PowerShell nos dois sistemas).

      - name: Arquivos, .env e composer.json
        if: ${{ !cancelled() && hashFiles('meu-app/artisan') != '' }}
        shell: pwsh
        working-directory: ${{ env.PROJETO }}
        run: |
          $falhas = [System.Collections.Generic.List[string]]::new()
          $esperados = @('artisan', 'composer.json', 'composer.lock', '.env', '.env.example', 'database/database.sqlite',
            'vendor/autoload.php', '.tws/manifest.json', 'compose.yaml', 'package.json', 'package-lock.json', 'phpunit.xml')
          $esperados += if ('${{ matrix.stack }}' -eq 'react') { @('resources/js/app.tsx') } else { @('app/Livewire') }
          foreach ($f in $esperados) { if (-not (Test-Path -LiteralPath $f)) { $falhas.Add("faltou $f") } }
          foreach ($f in @('kit-setup', 'starters', 'config/horizon.php', 'app/Providers/HorizonServiceProvider.php')) {
            if (Test-Path -LiteralPath $f) { $falhas.Add("sobrou $f") }
          }
          if (Test-Path -LiteralPath kit-setup) {
            Write-Host '--- o que sobrou em kit-setup'; Get-ChildItem -Recurse -LiteralPath kit-setup | ForEach-Object { $_.FullName }
          }

          $dotenv = Get-Content -LiteralPath .env
          foreach ($linha in @('DB_CONNECTION=sqlite', 'SESSION_DRIVER=database', 'CACHE_STORE=database', 'QUEUE_CONNECTION=database')) {
            if ($dotenv -notcontains $linha) { $falhas.Add(".env sem $linha") }
          }
          if (-not ($dotenv -match '^APP_KEY=base64:.+')) { $falhas.Add('.env sem APP_KEY') }
          foreach ($proibida in @('^REDIS_', '^HORIZON_', '^DB_HOST=', '^DB_PASSWORD=')) {
            if ($dotenv -match $proibida) { $falhas.Add(".env com $proibida") }
          }
          if ((Get-Content -LiteralPath .env.example) -notcontains 'DB_CONNECTION=sqlite') { $falhas.Add('.env.example sem DB_CONNECTION=sqlite') }

          $composer = Get-Content -Raw -LiteralPath composer.json | ConvertFrom-Json
          $require = $composer.require.PSObject.Properties.Name
          if ($require -contains 'laravel/horizon') { $falhas.Add('composer.json com laravel/horizon') }
          $interface = if ('${{ matrix.stack }}' -eq 'react') { 'inertiajs/inertia-laravel' } else { 'livewire/livewire' }
          if ($require -notcontains $interface) { $falhas.Add("composer.json sem $interface") }
          foreach ($p in @('twstec/kit-foundation', 'twstec/kit-auth', 'twstec/kit-accounts', 'twstec/kit-uploads', 'twstec/kit-admin', 'twstec/kit-webhooks')) {
            if ($require -notcontains $p) { $falhas.Add("composer.json sem $p") }
          }

          Write-Host '--- composer.json (require)'; $composer.require | Format-List | Out-String | Write-Host
          Write-Host '--- .tws/manifest.json (início)'; Get-Content -LiteralPath .tws/manifest.json -TotalCount 15
          Write-Host '--- .env (sem valores secretos)'; $dotenv | Where-Object { $_ -notmatch '(KEY|PEPPER|PASSWORD|SECRET)=' }
          Write-Host '--- composer show twstec/*'; composer show 'twstec/*'
          if ('${{ inputs.fonte }}' -eq 'branch') {
            foreach ($p in @('twstec/kit-foundation', 'twstec/kit-installer')) {
              $versao = (composer show $p --format=json | ConvertFrom-Json).versions[0]
              if ($versao -ne $env:VERSAO_BRANCH) { $falhas.Add("$p na versão $versao, não na da branch ($env:VERSAO_BRANCH)") }
            }
          }

          if ($falhas.Count -gt 0) { $falhas | ForEach-Object { Write-Host "::error::$_" }; exit 1 }

      - name: php artisan about
        if: ${{ !cancelled() && hashFiles('meu-app/artisan') != '' }}
        shell: pwsh
        working-directory: ${{ env.PROJETO }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          php artisan about
          $about = php artisan about --json | ConvertFrom-Json
          $d = $about.drivers
          $falhas = @()
          if ($d.database -ne 'sqlite') { $falhas += "banco: $($d.database)" }
          foreach ($k in @('cache', 'session', 'queue')) { if ($d.$k -ne 'database') { $falhas += "${k}: $($d.$k)" } }
          if ($falhas) { $falhas | ForEach-Object { Write-Host "::error::driver $_" }; exit 1 }

      - name: php artisan migrate
        if: ${{ !cancelled() && hashFiles('meu-app/artisan') != '' }}
        shell: pwsh
        working-directory: ${{ env.PROJETO }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          php artisan migrate --force
          $status = php artisan migrate:status
          $status
          if ($status -match 'Pending') { Write-Host '::error::migration pendente'; exit 1 }

      - name: Build do front
        if: ${{ !cancelled() && hashFiles('meu-app/artisan') != '' }}
        shell: pwsh
        working-directory: ${{ env.PROJETO }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci --ignore-scripts
          npm run build

      # A suíte inteira, nos dois sistemas: qualquer falha reprova o job.
      - name: php artisan test
        if: ${{ !cancelled() && hashFiles('meu-app/artisan') != '' }}
        shell: pwsh
        working-directory: ${{ env.PROJETO }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          php artisan test --compact
